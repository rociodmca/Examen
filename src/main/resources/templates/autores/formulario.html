<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Autor · Biblioteca</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><header th:replace="~{fragments :: header}"></header><main class="narrow"><a class="back" th:href="@{/autores}">← Volver a autores</a><h1 th:text="${autor.id == null ? 'Nuevo autor' : 'Editar autor'}"></h1><div class="card"><form th:action="@{/autores/guardar}" th:object="${autor}" method="post"><input type="hidden" th:field="*{id}"><label>Nombre<input th:field="*{nombre}" placeholder="Nombre completo"><small class="error" th:errors="*{nombre}"></small></label><div class="form-actions"><a class="button secondary" th:href="@{/autores}">Cancelar</a><button class="button" type="submit">Guardar</button></div></form></div></main></body></html>
