<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Autores · Biblioteca</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title"><div><p class="eyebrow">CATÁLOGO</p><h1>Autores</h1><p class="muted">Administra los autores relacionados con tus libros.</p></div><a class="button" th:href="@{/autores/nuevo}">+ Nuevo autor</a></div><div class="card"><table><thead><tr><th>Nombre</th><th>Libros</th><th>Acciones</th></tr></thead><tbody><tr th:each="autor : ${autores}"><td th:text="${autor.nombre}"></td><td th:text="${#lists.size(autor.libros)}"></td><td class="actions"><a th:href="@{/autores/editar/{id}(id=${autor.id})}">Editar</a><form th:action="@{/autores/borrar/{id}(id=${autor.id})}" method="post"><button class="link danger" type="submit" onclick="return confirm('¿Borrar este autor y sus libros?')">Borrar</button></form></td></tr></tbody></table></div></main></body></html>
