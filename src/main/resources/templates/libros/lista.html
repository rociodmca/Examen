<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Libros · Biblioteca</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title"><div><p class="eyebrow">CATÁLOGO</p><h1>Libros</h1><p class="muted">Gestiona el fondo bibliográfico de tu biblioteca.</p></div><a class="button" th:href="@{/libros/nuevo}">+ Nuevo libro</a></div><div class="card"><table><thead><tr><th>Título</th><th>ISBN</th><th>Año</th><th>Autor</th><th>Acciones</th></tr></thead><tbody><tr th:each="libro : ${libros}"><td th:text="${libro.titulo}"></td><td th:text="${libro.isbn}"></td><td th:text="${libro.anioPublicacion}"></td><td th:text="${libro.autor.nombre}"></td><td class="actions"><a th:href="@{/libros/editar/{id}(id=${libro.id})}">Editar</a><form th:action="@{/libros/borrar/{id}(id=${libro.id})}" method="post"><button class="link danger" type="submit" onclick="return confirm('¿Borrar este libro?')">Borrar</button></form></td></tr><tr th:if="${#lists.isEmpty(libros)}"><td colspan="5" class="empty">No hay libros registrados.</td></tr></tbody></table></div></main></body></html>
