<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Libro · Biblioteca</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><header th:replace="~{fragments :: header}"></header><main class="narrow"><a class="back" th:href="@{/libros}">← Volver al catálogo</a><h1 th:text="${libro.id == null ? 'Nuevo libro' : 'Editar libro'}"></h1><div class="card"><form th:action="@{/libros/guardar}" th:object="${libro}" method="post"><input type="hidden" th:field="*{id}"><label>Título<input th:field="*{titulo}" placeholder="Título del libro"><small class="error" th:errors="*{titulo}"></small></label><label>ISBN<input th:field="*{isbn}" placeholder="978-..."><small class="error" th:errors="*{isbn}"></small></label><label>Año de publicación<input type="number" th:field="*{anioPublicacion}"><small class="error" th:errors="*{anioPublicacion}"></small></label><label>Autor<select name="autorId" required><option value="">Selecciona un autor</option><option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}" th:selected="${libro.autor != null && autor.id == libro.autor.id}"></option></select></label><div class="form-actions"><a class="button secondary" th:href="@{/libros}">Cancelar</a><button class="button" type="submit">Guardar</button></div></form></div></main></body></html>
